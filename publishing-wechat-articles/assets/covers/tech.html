<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:540px;overflow:hidden;background:#101418;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.canvas{height:100%;padding:56px;display:grid;grid-template-columns:1fr 410px;gap:46px}.tag{color:#5eead4;font-size:20px;font-weight:700}.title{margin-top:46px;font-size:52px;line-height:1.18;font-weight:900}.summary{margin-top:24px;color:#cbd5e1;font-size:22px;line-height:1.5}.code{align-self:center;padding:28px;border:1px solid #334155;background:#0b0f14;font:18px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#86efac}.brand{position:absolute;left:56px;bottom:42px;color:#94a3b8;font-size:18px}
</style></head><body><main class="canvas"><section><div class="tag">{{TAG}}</div><div class="title">{{TITLE}}</div><div class="summary">{{SUMMARY}}</div></section><aside class="code">{{ACCENT}}</aside></main><div class="brand">{{BRAND}}</div></body></html>
