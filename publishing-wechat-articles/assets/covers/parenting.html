<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:540px;overflow:hidden;background:#fffaf5;color:#431407;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.canvas{height:100%;padding:58px 62px;display:grid;grid-template-columns:1fr 360px;gap:58px}.tag{color:#ea580c;font-size:20px;font-weight:700}.title{margin-top:40px;font-size:50px;line-height:1.22;font-weight:900}.summary{margin-top:24px;color:#7c2d12;font-size:22px;line-height:1.55}.accent{align-self:center;padding:34px;border:2px solid #fdba74;background:#ffedd5;color:#9a3412;font-size:26px;line-height:1.6}.brand{position:absolute;left:62px;bottom:42px;color:#c2410c;font-size:18px}
</style></head><body><main class="canvas"><section><div class="tag">{{TAG}}</div><div class="title">{{TITLE}}</div><div class="summary">{{SUMMARY}}</div></section><aside class="accent">{{ACCENT}}</aside></main><div class="brand">{{BRAND}}</div></body></html>
